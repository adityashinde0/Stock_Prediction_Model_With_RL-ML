name: CI/CD Testing Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies (OpenCV & EasyOCR Requirements)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Static Code Analysis (Ruff Linter)
        run: |
          ruff check src/ tests/ app.py --select=E,F,W --ignore=E501 --exit-zero

      - name: Execute Automated Unit & Integration Tests
        run: |
          pytest tests/ --cov=src --cov-report=term-missing -v